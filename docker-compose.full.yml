version: '3.8'

# Full deployment stack: database + application.
# For local development (DB only) use docker-compose.yml instead.
#
# Usage:
#   1. cp .env.example .env   # fill in DB_PASSWORD and JWT_SECRET
#   2. docker compose -f docker-compose.full.yml up -d
#   3. Open http://localhost:8080

services:
  postgres:
    image: postgres:16
    container_name: smarthome-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dist
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
